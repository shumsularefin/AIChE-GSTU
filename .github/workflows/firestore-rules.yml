name: Deploy Firestore security rules

# Started by hand (Actions → Deploy Firestore security rules → Run workflow) from main.
# The "firestore-rules" environment requires approval by the repository owner before deploying.
# It uses its own service account, which can only change security rules (not Hosting or data).
# Needs the repository variables FIREBASE_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_RULES_SERVICE_ACCOUNT.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Security rules (Firestore emulator)
        run: npm run test:rules

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: firestore-rules
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RULES_SERVICE_ACCOUNT }}
      - name: Deploy Firestore rules
        run: npx firebase deploy --only firestore:rules --project ${{ vars.FIREBASE_PROJECT_ID }} --non-interactive
